name: "02 · Alerta Período Crítico (15 dias)"

on:
  schedule:
    # Todo dia às 8h (horário de Brasília = 11h UTC)
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  alerta_critico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Verificar e notificar período crítico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAILS_DESTINO: ${{ secrets.EMAILS_DESTINO }}
          CALLMEBOT_NUMEROS: ${{ secrets.CALLMEBOT_NUMEROS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SISTEMA_URL: ${{ secrets.SISTEMA_URL }}
        run: python scripts/alerta_periodo_critico.py
