name: "01 · Relatório Semanal de Vigências"

on:
  schedule:
    # Toda segunda-feira às 10h (horário de Brasília = UTC-3, então 13h UTC)
    - cron: "0 13 * * 1"
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Executar relatório semanal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          EMAILS_DESTINO: ${{ secrets.EMAILS_DESTINO }}
          CALLMEBOT_NUMEROS: ${{ secrets.CALLMEBOT_NUMEROS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SISTEMA_URL: ${{ secrets.SISTEMA_URL }}
        run: python scripts/relatorio_semanal.py
