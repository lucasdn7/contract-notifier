name: "03 · Novo Processo / Vigência Alterada"

on:
  repository_dispatch:
    # O Supabase chama a API do GitHub com esses event types
    types:
      - novo_processo
      - vigencia_editada

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Notificar novo processo
        if: github.event.action == 'novo_processo'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAILS_DESTINO: ${{ secrets.EMAILS_DESTINO }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CALLMEBOT_NUMEROS: ${{ secrets.CALLMEBOT_NUMEROS }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SISTEMA_URL: ${{ secrets.SISTEMA_URL }}
          # O payload do Supabase vem aqui como JSON string
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/novo_processo.py

      - name: Notificar vigência editada
        if: github.event.action == 'vigencia_editada'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAILS_DESTINO: ${{ secrets.EMAILS_DESTINO }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CALLMEBOT_NUMEROS: ${{ secrets.CALLMEBOT_NUMEROS }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SISTEMA_URL: ${{ secrets.SISTEMA_URL }}
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/vigencia_editada.py
